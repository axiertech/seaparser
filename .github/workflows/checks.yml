name: SeaParser checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: python -B -m scripts.check
      - run: npm run check && npm test
        working-directory: frontend
  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: seaparser_test
          POSTGRES_USER: seaparser_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seaparser_test -d seaparser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      TEST_DB_PASSWORD: ci-disposable-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: command -v psql
      - run: python -B -m scripts.migrate --environment test --apply
      - run: python -B -m scripts.migrate --environment test --apply
      - name: Reject modified applied migration
        shell: bash
        run: |
          printf '\n-- checksum test\n' >> migrations/0001_baseline.sql
          if python -B -m scripts.migrate --environment test --apply; then
            exit 1
          fi
