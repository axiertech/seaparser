name: SeaParser checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.1'
      - run: >-
          python -m pip install --index-url https://pypi.org/simple
          --require-hashes --only-binary=:all: -r requirements.lock
      - run: npm exec --yes --package=npm@9.2.0 -- npm --prefix frontend ci --ignore-scripts
      - run: python -B -m scripts.check
      - run: npm exec --yes --package=npm@9.2.0 -- npm --prefix frontend run check
      - run: npm exec --yes --package=npm@9.2.0 -- npm --prefix frontend test
      - name: Verify explicitly published PoC over HTTPS
        if: contains(github.event.head_commit.message, '[verify-poc-public]')
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import sha256
          import json
          from urllib.request import urlopen
          receipt=json.load(open('artifacts/poc-site/build-receipt.json'))
          def verify(item):
              path,expected=item
              with urlopen('https://seaparser.com/poc/'+path+'?sha='+expected,timeout=20) as response:
                  assert response.status==200, path
                  assert response.url.startswith('https://seaparser.com/poc/'), path
                  assert sha256(response.read(8_000_001)).hexdigest()==expected, path
              return path
          with ThreadPoolExecutor(max_workers=4) as pool:
              verified=list(pool.map(verify,receipt['files'].items()))
          print('POC_HTTPS_VERIFIED',len(verified),'files; HTML, assets, real route results and GPX match this commit')
          PY
  capture-uddevalla:
    if: contains(github.event.head_commit.message, '[capture-uddevalla]')
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
      - run: >-
          python -m pip install --index-url https://pypi.org/simple
          --require-hashes --only-binary=:all: -r requirements.lock
      - name: Capture public native MET and OSM data only
        run: python -B -m scripts.fetch_uddevalla --output data/uddevalla --request-file settings/vinga-uddevalla-request.json --public-only
      - name: Return public capture through repository blobs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B -m scripts.share_public_capture data/uddevalla
